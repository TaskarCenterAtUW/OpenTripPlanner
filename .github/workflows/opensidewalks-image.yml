# Builds the image of OTP with OpenSidewalks and the AccessMap web app, see
# docker/opensidewalks/README.md, and pushes it to the registry of the organization. A pull request
# does not run this, so that code which has not been merged never gets the registry password.
name: OpenSidewalks image

on:
  push:
    branches:
      - opensidewalks-dynamic

permissions:
  contents: read

concurrency:
  group: opensidewalks-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKERHUB_REGISTRY }}
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/opensidewalks/Dockerfile
          build-contexts: accessmap=https://github.com/TaskarCenterAtUW/AccessMapWebAppOTP.git#main
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ vars.DOCKERHUB_REGISTRY }}/otp-accessmap:${{ github.sha }}
            ${{ github.ref_name == 'opensidewalks-dynamic' && format('{0}/otp-accessmap:latest', vars.DOCKERHUB_REGISTRY) || '' }}
