<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Accessible pedestrian and transit trip planning" />
    <link rel="icon" href="favicon.ico?v=2" />
    <link rel="stylesheet" href="/main.css" type="text/css" />
    <title>AccessMap</title>
  </head>
  <body>
    <div id="root" style="height: 100%;"></div>
    <script>
      // The app reads config.json as soon as it runs, so it starts once that has been loaded
      fetch("/config.json")
        .then(function (response) {
          if (!response.ok) throw new Error("HTTP " + response.status);
          return response.json();
        })
        .then(function (config) {
          window.ACCESSMAP_CONFIG = config;
          var app = document.createElement("script");
          app.src = "/index.bundle.js";
          document.body.appendChild(app);
        })
        .catch(function (error) {
          document.getElementById("root").textContent =
            "AccessMap could not load its configuration: " + error.message;
        });
    </script>
  </body>
</html>
