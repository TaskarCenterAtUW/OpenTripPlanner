# Serves the AccessMap web app, and sends only the calls it makes to OTP.
worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  access_log off;
  gzip on;
  gzip_types application/json application/javascript text/css application/x-protobuf;

  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  server {
    listen 8080;
    root /tmp/accessmap-ui;

    location / {
      try_files $uri /index.html;
    }

    location = /config.json {
      add_header Cache-Control no-cache;
    }

    location = /api/v1/routing/otp/gtfs/v1 {
      proxy_pass http://127.0.0.1:8090/otp/gtfs/v1;
      proxy_read_timeout 120s;
    }

    location /api/v1/routing/otp/routers/default/vectorTiles/ {
      proxy_pass http://127.0.0.1:8090/otp/routers/default/vectorTiles/;
    }
  }
}
